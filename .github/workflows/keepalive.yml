name: Supabase keep-alive

# Un projet Supabase gratuit est mis en pause après 7 jours sans requête.
# Ce ping toutes les 72 h le garde actif.
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.VITE_SUPABASE_URL != '' }}
    steps:
      - name: Ping REST endpoint
        run: |
          curl -fsS "${{ vars.VITE_SUPABASE_URL }}/rest/v1/allowed_domains?select=domain&limit=1" \
            -H "apikey: ${{ vars.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ vars.VITE_SUPABASE_ANON_KEY }}" || true
